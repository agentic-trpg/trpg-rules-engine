name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      level:
        description: Validation tier
        type: choice
        options: [full, integration, fast]
        default: full

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select validation
    if: github.event_name != 'workflow_dispatch' || inputs.level != 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select PR comparison base
        id: scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "base=$(git merge-base "$PR_BASE" "$PR_HEAD")" >> "$GITHUB_OUTPUT"

  validation:
    name: Fast / Focused Validation
    needs: scope
    if: inputs.level != 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: raven-actions/actionlint@v2
      - name: Validate once with shared impact selection
        env:
          BASE: ${{ needs.scope.outputs.base }}
          LEVEL: ${{ inputs.level }}
        run: |
          if [ "$LEVEL" = integration ]; then
            make check-integration BASE="$BASE"
          elif [ "$LEVEL" = fast ]; then
            make check-fast BASE="$BASE"
          else
            make check-auto BASE="$BASE"
          fi

  full:
    name: Full Validation
    if: github.event_name == 'workflow_dispatch' && inputs.level == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: raven-actions/actionlint@v2
      - run: make check
