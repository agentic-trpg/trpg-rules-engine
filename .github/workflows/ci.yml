name: CI

on:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check dnd5e-srd-data
        working-directory: packages/dnd5e-srd-data
        run: |
          uv sync --extra dev
          make check
      - name: Check dnd5e-engine
        working-directory: packages/dnd5e-engine
        run: |
          uv sync --extra dev
          make check
          bash scripts/smoke_clean_install.sh
      - name: Check nat20-bridge
        working-directory: packages/nat20-bridge
        run: |
          uv sync --extra dev
          make check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check nat20-demo
        working-directory: apps/demo
        run: |
          uv sync --extra dev
          make check
      - name: Check examples
        run: |
          uv sync --all-packages
          uv run python examples/grid_combat.py
          uv run python examples/skill_check.py
          uv run python examples/build_party_member.py
      - name: Check docs
        run: |
          uv sync --group docs
          uv run --group docs mkdocs build --strict
