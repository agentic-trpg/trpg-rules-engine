name: Deploy docs

# Ordinary docs changes are built by CI, without touching the Pages API.
# Enable Pages in Settings, set PAGES_ENABLED=true, then dispatch on main with deploy=true.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to configured GitHub Pages (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
      - uses: actions/upload-pages-artifact@v5
        if: inputs.deploy && vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: Deploy configured Pages
    needs: build
    if: inputs.deploy && vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
