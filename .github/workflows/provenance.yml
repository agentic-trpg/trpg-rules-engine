name: SRD Provenance

# Heavy job (clones ~700MB of pinned upstreams + re-runs regen), so it runs
# only when manually dispatched. Verifies (1) raw_sources/foundry still
# matches the pinned content digest and (2) `make regen` reproduces the
# committed canonical/ tree byte-for-byte from the pinned upstream sources.
on:
  workflow_dispatch:

jobs:
  provenance:
    name: canonical provenance & regen determinism
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/dnd5e-srd-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      # Shallow-clones each pinned upstream into raw_sources/ (see PINS.json).
      - run: make refresh-upstream
      # check_foundry_pin (digest match) + check-regen-clean (regen reproduces canonical/).
      - run: make check-provenance
